version: '3.8'

services:
  sd-fuzz:
    build:  .
    container_name: sd-fuzz
    volumes:
      - ./output:/app/output
      - ./seeds:/app/seeds
    environment:
      - PYTHONUNBUFFERED=1
    command: python main.py --host target --port 502 --iterations 10000
    depends_on:
      - target
    networks:
      - fuzz-network

  target:
    image: python:3.9
    container_name: modbus-target
    command: >
      bash -c "pip install pymodbus &&
               python -c 'from pymodbus.server.sync import StartTcpServer;
                          from pymodbus.datastore import ModbusServerContext, ModbusSlaveContext, ModbusSequentialDataBlock;
                          store = ModbusSlaveContext(
                              di=ModbusSequentialDataBlock(0, [0]*100),
                              co=ModbusSequentialDataBlock(0, [0]*100),
                              hr=ModbusSequentialDataBlock(0, [0]*100),
                              ir=ModbusSequentialDataBlock(0, [0]*100));
                          context = ModbusServerContext(slaves=store, single=True);
                          StartTcpServer(context, address=(\"0.0.0.0\", 502))'"
    ports:
      - "502:502"
    networks:
      - fuzz-network

networks:
  fuzz-network:
    driver: bridge